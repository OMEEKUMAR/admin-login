<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shri Ji Janseva Kendra — Admin Panel</title><style>body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f4f6f8;margin:0;color:#222}.top{background:#b40000;color:#fff;padding:16px 5%;font-size:22px;font-weight:700}.wrap{max-width:950px;margin:30px auto;padding:0 18px}.box{background:#fff;border-radius:10px;padding:22px;margin-bottom:20px;box-shadow:0 2px 10px #0001}h2{margin-top:0;color:#0b315b}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:16px}button{border:0;border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer;margin-top:14px}.red{background:#b40000;color:#fff}.gray{background:#ddd}.danger{background:#dc3545;color:#fff}.hide{display:none!important}.msg{padding:10px;border-radius:6px;margin-top:12px;background:#fff3cd;color:#664d03}.success{background:#d1e7dd;color:#0f5132}.item{border:1px solid #ddd;padding:14px;margin:10px 0;border-radius:7px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{color:#666}.actions button{margin-left:6px}.error{background:#f8d7da;color:#842029}.muted{color:#666;font-size:13px}.headrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.headrow button{margin-top:0}@media(max-width:650px){.headrow{align-items:flex-start;flex-direction:column}.item{flex-direction:column;align-items:flex-start}}
</style></head><body><div class="top">🔐 Shri Ji Janseva Kendra — Admin Panel</div><div class="wrap">
<div id="loginBox" class="box"><h2>Admin Login</h2><label>Email</label><input id="email" type="email" value="omeepra2061222@gmail.com" autocomplete="username"><label>Password</label><input id="password" type="password" value="206122" autocomplete="current-password"><button id="loginBtn" class="red">Login</button><div id="loginMsg" class="msg hide"></div><p class="muted">Firebase Authentication में यही email user बना होना चाहिए।</p></div>
<div id="panel" class="hide"><div class="box"><div class="headrow"><h2>Vacancy जोड़ें</h2><button class="gray" id="logoutBtn">Logout</button></div><label>Category</label><select id="cat"><option>Results</option><option>Admit Cards</option><option>Latest Jobs</option></select><label>Vacancy / Result का नाम</label><input id="title" placeholder="जैसे SSC CGL Result 2026"><label>Link</label><input id="link" placeholder="https://..."><button id="addBtn" class="red">+ Vacancy जोड़ें</button><div id="addMsg" class="msg hide"></div></div><div class="box"><h2>Added Vacancies</h2><div id="list">लोड हो रहा है...</div></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyCgI9qUtwwEtQbpcgyg7PCfg5ELh6xbiFw",authDomain:"shreeji-janseva-kendra.firebaseapp.com",databaseURL:"https://shreeji-janseva-kendra-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"shreeji-janseva-kendra",storageBucket:"shreeji-janseva-kendra.firebasestorage.app",messagingSenderId:"12714204809",appId:"1:12714204809:web:852670e019a0886055b058",measurementId:"G-JSQXRWB6E6"};
let auth=null,db=null;
const $=id=>document.getElementById(id);
function msg(id,text,type=''){const e=$(id);e.textContent=text;e.className='msg '+type}
function codeMsg(e){const map={'auth/invalid-credential':'Email या Password गलत है।','auth/invalid-email':'Email सही नहीं है।','auth/user-not-found':'यह email Firebase में नहीं है।','auth/wrong-password':'Password गलत है।','auth/network-request-failed':'Internet connection जाँचें।','auth/too-many-requests':'बहुत बार कोशिश हुई है, थोड़ी देर बाद फिर कोशिश करें।'};return map[e.code]||((e.code||'Firebase error')+': '+e.message)}
try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.database()}catch(e){msg('loginMsg','Firebase शुरू नहीं हुआ: '+e.message,'error')}
if(auth){auth.onAuthStateChanged(user=>{if(user){$('loginBox').classList.add('hide');$('panel').classList.remove('hide');load()}else{$('loginBox').classList.remove('hide');$('panel').classList.add('hide')}})}
$('loginBtn').addEventListener('click',()=>{const email=$('email').value.trim(),pass=$('password').value;if(!email||!pass){msg('loginMsg','Email और Password भरें।','error');return}msg('loginMsg','Login हो रहा है...');$('loginBtn').disabled=true;if(!auth){msg('loginMsg','Firebase load नहीं हुआ। GitHub Pages पर खोलकर फिर कोशिश करें।','error');$('loginBtn').disabled=false;return}auth.signInWithEmailAndPassword(email,pass).catch(e=>msg('loginMsg',codeMsg(e),'error')).finally(()=>$('loginBtn').disabled=false)});
$('logoutBtn').addEventListener('click',()=>auth&&auth.signOut());
$('addBtn').addEventListener('click',()=>{const title=$('title').value.trim(),link=$('link').value.trim(),cat=$('cat').value;if(!title||!link){msg('addMsg','नाम और Link दोनों भरें।','error');return}let u;try{u=new URL(link)}catch(e){msg('addMsg','Link सही URL होना चाहिए, जैसे https://example.com','error');return}if(!/^https?:$/.test(u.protocol)){msg('addMsg','केवल http/https Link डालें।','error');return}$('addBtn').disabled=true;db.ref('vacancies').push({cat,title,link:u.href,createdAt:Date.now()}).then(()=>{$('title').value='';$('link').value='';msg('addMsg','Vacancy सफलतापूर्वक जोड़ दी गई।','success')}).catch(e=>msg('addMsg','Database error: '+e.message,'error')).finally(()=>$('addBtn').disabled=false)});
function load(){db.ref('vacancies').on('value',s=>{const d=s.val()||{},arr=Object.entries(d).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));$('list').innerHTML=arr.length?arr.map(([id,x])=>`<div class="item"><div><b>${esc(x.title)}</b><br><small>${esc(x.cat)} — <a href="${esc(x.link)}" target="_blank" rel="noopener">Link</a></small></div><div class="actions"><button class="danger" onclick="del('${id}')">Delete</button></div></div>`).join(''):'अभी कोई Vacancy नहीं है।'})}
function del(id){if(!confirm('यह Vacancy हटाएँ?'))return;db.ref('vacancies/'+id).remove().catch(e=>msg('addMsg','Delete error: '+e.message,'error'))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
