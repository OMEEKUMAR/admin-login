<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shri Ji Admin Panel</title>
<style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#222}.top{background:#b40000;color:#fff;padding:16px 5%;font-size:22px;font-weight:700}.wrap{max-width:900px;margin:30px auto;padding:0 18px}.box{background:#fff;border-radius:10px;padding:22px;margin-bottom:20px;box-shadow:0 2px 10px #0001}h2{margin-top:0;color:#0b315b}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:16px}button{border:0;border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer;margin-top:14px}.red{background:#b40000;color:#fff}.blue{background:#0b5ed7;color:#fff}.gray{background:#ddd}.item{border:1px solid #ddd;padding:14px;margin:10px 0;border-radius:7px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{color:#666}.hide{display:none}.msg{padding:10px;background:#fff3cd;border-radius:6px;margin-top:12px}.danger{background:#dc3545;color:#fff}</style></head><body><div class="top">🔐 Shri Ji Janseva Kendra — Admin Panel</div><div class="wrap">
<div id="login" class="box"><h2>Admin Login</h2><label>Email</label><input id="email" type="email" value="admin@shreeji.com"><label>Password</label><input id="password" type="password"><button class="red" onclick="login()">Login</button><div id="loginMsg" class="msg hide"></div><p style="font-size:13px;color:#666">Firebase Authentication में इसी email का user बनाना होगा।</p></div>
<div id="panel" class="hide"><div class="box"><button class="gray" style="float:right" onclick="logout()">Logout</button><h2>Vacancy जोड़ें</h2><label>Category</label><select id="cat"><option>Results</option><option>Admit Cards</option><option>Latest Jobs</option></select><label>Vacancy / Result का नाम</label><input id="title" placeholder="जैसे SSC CGL Result 2026"><label>Link</label><input id="link" placeholder="https://..."><button class="red" onclick="addVacancy()">+ Vacancy जोड़ें</button><div id="msg" class="msg hide"></div></div>
<div class="box"><h2>Added Vacancies</h2><div id="list">लोड हो रहा है...</div></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="../firebase-config.js"></script><script>
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);auth.onAuthStateChanged(u=>{if(u){$('login').classList.add('hide');$('panel').classList.remove('hide');load()}else{$('login').classList.remove('hide');$('panel').classList.add('hide')}});
function login(){auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value).catch(e=>show('loginMsg','Login failed: '+e.message))}
function logout(){auth.signOut()}
function show(id,t){$(id).textContent=t;$(id).classList.remove('hide');setTimeout(()=>$(id).classList.add('hide'),4000)}
function addVacancy(){const title=$('title').value.trim(),link=$('link').value.trim(),cat=$('cat').value;if(!title||!link)return show('msg','नाम और Link दोनों भरें।');db.ref('vacancies').push({cat,title,link,createdAt:Date.now()}).then(()=>{$('title').value='';$('link').value='';show('msg','Vacancy जोड़ दी गई।')}).catch(e=>show('msg','Error: '+e.message))}
function load(){db.ref('vacancies').on('value',s=>{const d=s.val()||{};const arr=Object.entries(d).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));$('list').innerHTML=arr.length?arr.map(([id,x])=>`<div class="item"><div><b>${esc(x.title)}</b><br><small>${esc(x.cat)} — <a href="${esc(x.link)}" target="_blank">Link</a></small></div><button class="danger" onclick="del('${id}')">Delete</button></div>`).join(''):'अभी कोई Vacancy नहीं है।'})}
function del(id){if(confirm('यह Vacancy हटाएँ?'))db.ref('vacancies/'+id).remove()}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
